services:
  outage-locator:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Optional: set to enable AI dispatch notes (Groq or Anthropic free tier)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SEED_POLE_COUNT=${SEED_POLE_COUNT:-3600}
      # Fast Demo Timers (snappy incident creation for live demos)
      - HEARTBEAT_INTERVAL_SECONDS=15
      - HEARTBEAT_JITTER_SECONDS=5
      - MISSED_HEARTBEATS_FOR_SILENCE=2
      - DEBOUNCE_SECONDS=10
      - RESTORATION_STABILITY_SECONDS=15
      - DETECTION_LOOP_INTERVAL_SECONDS=2.0
    volumes:
      - outage-data:/app/data
    restart: unless-stopped

volumes:
  outage-data:
